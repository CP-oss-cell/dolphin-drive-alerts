name: Build Dolphin Cluster V1.2 (vehicle-only install + local ADB)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vehicle-only-cluster-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLUSTER_KEYSTORE_B64: ${{ secrets.CLUSTER_KEYSTORE_B64 }}
      CLUSTER_STORE_PASSWORD: ${{ secrets.CLUSTER_STORE_PASSWORD }}
      CLUSTER_KEY_ALIAS: ${{ secrets.CLUSTER_KEY_ALIAS }}
      CLUSTER_KEY_PASSWORD: ${{ secrets.CLUSTER_KEY_PASSWORD }}
    steps:
      - name: Fetch sources
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (no deprecated tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Expand standalone project safely
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='DolphinClusterReadOnlyTrial-v1.2-source.zip'
          test -f "$SOURCE"
          OUT="$RUNNER_TEMP/cluster-v12"
          mkdir -p "$OUT"
          unzip -q "$SOURCE" -d "$OUT"
          test -f "$OUT/settings.gradle"
          test -f "$OUT/app/src/main/java/com/dolphin/clusterprobe/LocalAdb.java"
          test -f "$OUT/app/src/main/java/com/dolphin/clusterprobe/ApkFileProvider.java"
      - name: Local ADB RSA + handshake protocol test (mock, no car)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cluster-v12"
          python3 tools/test_local_adb_mock.py
      - name: Configure optional stable release APK signing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$CLUSTER_KEYSTORE_B64" && -n "$CLUSTER_STORE_PASSWORD" && -n "$CLUSTER_KEY_ALIAS" && -n "$CLUSTER_KEY_PASSWORD" ]]; then
            SIGN_FILE="$RUNNER_TEMP/cluster-vehicle-only-signing.jks"
            printf '%s' "$CLUSTER_KEYSTORE_B64" | base64 --decode > "$SIGN_FILE"
            chmod 600 "$SIGN_FILE"
            echo "CLUSTER_SIGNING_STORE=$SIGN_FILE" >> "$GITHUB_ENV"
            echo "CLUSTER_SIGNING_MODE=release" >> "$GITHUB_ENV"
            echo 'Stable release signing configured (keystore not uploaded).' 
          elif [[ -z "$CLUSTER_KEYSTORE_B64" && -z "$CLUSTER_STORE_PASSWORD" && -z "$CLUSTER_KEY_ALIAS" && -z "$CLUSTER_KEY_PASSWORD" ]]; then
            echo 'CLUSTER_SIGNING_MODE=debug' >> "$GITHUB_ENV"
            echo 'No persistent signing configured: output is DEBUG and updates may fail across separate runs.'
          else
            echo 'ERROR: Incomplete signing secrets, require all four or none.' >&2
            exit 1
          fi
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CLUSTER_SIGNING_MODE" == 'release' ]]; then
            gradle --no-daemon -p "$RUNNER_TEMP/cluster-v12" :app:assembleRelease
          else
            gradle --no-daemon -p "$RUNNER_TEMP/cluster-v12" :app:assembleDebug
          fi
      - name: Record APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cluster-built"
          mkdir -p "$OUT"
          if [[ "$CLUSTER_SIGNING_MODE" == 'release' ]]; then
            cp "$RUNNER_TEMP/cluster-v12/app/build/outputs/apk/release/app-release.apk" "$OUT/DolphinCluster-v1.2-VEHICLE-RELEASE.apk"
          else
            cp "$RUNNER_TEMP/cluster-v12/app/build/outputs/apk/debug/app-debug.apk" "$OUT/DolphinCluster-v1.2-VEHICLE-DEBUG.apk"
          fi
          (cd "$OUT" && sha256sum *.apk > SHA256.txt)
      - name: Publish APK to Actions artifacts for manual installation
        uses: actions/upload-artifact@v4
        with:
          name: DolphinCluster-V1.2-VEHICLE-APK
          path: ${{ runner.temp }}/cluster-built/
          if-no-files-found: error
          retention-days: 14
