          aWZ5X3Byb2plY3QucHlQSwUGAAAAADAAMAArDgAAi+4AAAAA
          """

          def extract_zip(data, label):
              digest = hashlib.sha256(data).hexdigest()
              if digest != expected_sha256:
                  raise RuntimeError('Source archive checksum mismatch in ' + label + '. Verify matching v2.0.3 ZIP/YML files.')
              with ZipFile(BytesIO(data)) as zf:
                  if zf.testzip() is not None:
                      raise RuntimeError('Damaged source ZIP: ' + label)
                  for item in zf.infolist():
                      name = item.filename.replace('\\', '/')
                      p = Path(name)
                      if p.is_absolute() or '..' in p.parts or p.drive:
                          raise RuntimeError('Unsafe ZIP path: ' + name)
                      if (item.external_attr >> 16) & 0o170000 == stat.S_IFLNK:
                          raise RuntimeError('Links forbidden in source ZIP: ' + name)
                      out = (target / p).resolve()
                      if not out.is_relative_to(target.resolve()):
                          raise RuntimeError('Invalid extraction target: ' + name)
                      if item.is_dir():
                          out.mkdir(parents=True, exist_ok=True)
                      else:
                          out.parent.mkdir(parents=True, exist_ok=True)
                          with zf.open(item) as inp, out.open('wb') as dst:
                              shutil.copyfileobj(inp, dst)
              print('RESTORED:', label, 'SHA256:', digest)

          if source.is_file():
              extract_zip(source.read_bytes(), source.name)
              print('MODE: Repository source ZIP')
          else:
              # No separate source ZIP committed: this workflow can still build.
              packed = base64.b64decode(''.join(bundled.split()), validate=True)
              extract_zip(packed, 'Embedded v2.0.3 source')
              print('MODE: Embedded source fallback (no repository ZIP required)')

          required = ('settings.gradle', 'build.gradle', 'app/build.gradle', 'tests/verify_project.py')
          for f in required:
              if not (target / f).is_file():
                  raise RuntimeError('Required project file missing: ' + f)
          if "rootProject.name = 'MideumHanaBrowser'" not in (target / 'settings.gradle').read_text():
              raise RuntimeError('Wrong project name in project ZIP')
          gradle = (target / 'app/build.gradle').read_text()
          if "applicationId 'com.mideumhana.browser'" not in gradle or "versionName '2.0.3'" not in gradle:
              raise RuntimeError('Wrong app or version in source ZIP')
          print('MIDEUMHANA_PROJECT_READY:', target)
          PYUNZIP

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android 35 platform and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify MideumHanaBrowser source
        working-directory: .mideumhana-browser-build
        shell: bash
        run: |
          python3 tests/verify_project.py
          python3 tests/android_resources_regression.py
          java tests/JavaSyntaxCheck.java $(find app/src/main/java -name '*.java')
          python3 tests/offline_regression.py
          python3 tests/bridgefree_regression.py
          python3 tests/security_regression.py
          python3 tests/ui_regression.py
          python3 tests/r07_regression.py
          python3 tests/fold_tabs_regression.py
          python3 tests/rebrand_regression.py
          python3 tests/v2_fresh_install_regression.py
          python3 tests/v202_build_regression.py

      - name: Build MideumHanaBrowser APK (auto debug or release)
        id: build_apk
        working-directory: .mideumhana-browser-build
        shell: bash
        env:
          MHB_KEYSTORE_BASE64: ${{ secrets.MHB_KEYSTORE_BASE64 }}
          MHB_SIGNING_PASSWORD: ${{ secrets.MHB_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$MHB_KEYSTORE_BASE64" && -n "$MHB_SIGNING_PASSWORD" ]]; then
            export MHB_SIGNING_KEYSTORE_PATH="${RUNNER_TEMP}/mideumhana-release.jks"
            printf '%s' "$MHB_KEYSTORE_BASE64" | base64 --decode > "$MHB_SIGNING_KEYSTORE_PATH"
            chmod 600 "$MHB_SIGNING_KEYSTORE_PATH"
            keytool -list -keystore "$MHB_SIGNING_KEYSTORE_PATH" -alias mideumhana \
              -storepass "$MHB_SIGNING_PASSWORD" >/dev/null
            gradle --no-daemon --stacktrace :app:assembleRelease
            apk=app/build/outputs/apk/release/app-release.apk
            kind=Release
            echo '### 믿음하나 브라우저 v2.0.3 — 업데이트용 Release APK 생성' >> "$GITHUB_STEP_SUMMARY"
            echo '이후 버전에서도 반드시 동일한 키스토어/패키지 ID와 증가한 versionCode를 사용하세요.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ -z "$MHB_KEYSTORE_BASE64" && -z "$MHB_SIGNING_PASSWORD" ]]; then
            gradle --no-daemon --stacktrace :app:assembleDebug
            apk=app/build/outputs/apk/debug/app-debug.apk
            kind=Debug_NO_UPDATE_GUARANTEE
            echo '### 믿음하나 브라우저 v2.0.3 — 임시 테스트용 Debug APK 생성' >> "$GITHUB_STEP_SUMMARY"
            echo '> 경고: Debug APK의 서명은 이후 빌드에서 달라질 수 있어 업데이트 설치가 보장되지 않습니다.' >> "$GITHUB_STEP_SUMMARY"
            echo '> 정식 설치 및 업데이트를 원하면 SIGNING_SETUP_KO.md의 1회 Secrets 설정 후 Release APK를 설치하세요.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::GitHub Secrets 두 개 중 하나만 등록됐습니다. MHB_KEYSTORE_BASE64, MHB_KEYSTORE_PASSWORD를 모두 등록하거나 모두 비워 두세요.'
            exit 1
          fi
          test -s "$apk"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "apk_path=.mideumhana-browser-build/$apk" >> "$GITHUB_OUTPUT"
          echo "APK_FILE=$apk"

      - name: Upload 믿음하나 브라우저 v2.0.3 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MideumHanaBrowser_v2.0.3_${{ steps.build_apk.outputs.kind }}_APK
          path: ${{ steps.build_apk.outputs.apk_path }}
          if-no-files-found: error
