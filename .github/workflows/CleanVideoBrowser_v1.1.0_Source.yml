name: CleanVideoBrowser v1.1.0 APK
run-name: CleanVideoBrowser v1.1.0 / APK build

on:
  workflow_dispatch:
  push:
    paths:
      - 'CleanVideoBrowser_v1.1.0_Source.zip'
      - 'CleanVideoBrowser_v1.1.0_Complete_Build_Package.zip'
      - '.github/workflows/CleanVideoBrowser_v1.1.0_Source.yml'
      - 'app/**'
      - 'tests/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'

permissions:
  contents: read

concurrency:
  group: CleanVideoBrowser-v1.1.0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    name: CleanVideoBrowser / build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack CleanVideoBrowser project automatically
        shell: bash
        run: |
          python3 - <<'PYUNZIP'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          target = root / '.cleanvideobrowser-build'
          target.mkdir(exist_ok=True)
          source = root / 'CleanVideoBrowser_v1.1.0_Source.zip'
          outer = root / 'CleanVideoBrowser_v1.1.0_Complete_Build_Package.zip'

          def safe_extract(zf, destination):
              for item in zf.infolist():
                  name = item.filename.replace('\\', '/')
                  p = Path(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise RuntimeError('Unsafe source ZIP path: ' + name)
                  dest = (destination / p).resolve()
                  if not dest.is_relative_to(destination.resolve()):
                      raise RuntimeError('Unsafe extraction destination: ' + name)
                  if name.endswith('/'):
                      dest.mkdir(parents=True, exist_ok=True)
                  else:
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(item) as inp, dest.open('wb') as out:
                          import shutil
                          shutil.copyfileobj(inp, out)

          if source.is_file():
              with ZipFile(source) as zf:
                  safe_extract(zf, target)
              print('EXTRACTED_SOURCE_ZIP:', source.name)
          elif outer.is_file():
              from io import BytesIO
              with ZipFile(outer) as pkg:
                  with ZipFile(BytesIO(pkg.read(source.name))) as zf:
                      safe_extract(zf, target)
              print('EXTRACTED_NESTED_SOURCE_ZIP:', outer.name)
          elif (root / 'settings.gradle').is_file() and (root / 'app/build.gradle').is_file():
              # Compatibility with GitHub repositories where the source is already unpacked.
              import shutil
              for f in ('settings.gradle', 'build.gradle', 'gradle.properties'):
                  shutil.copy2(root / f, target / f)
              for d in ('app', 'tests'):
                  if (root / d).is_dir():
                      shutil.copytree(root / d, target / d, dirs_exist_ok=True)
              print('EXTRACTED_FROM_REPO_ROOT')
          else:
              raise RuntimeError('Source ZIP not found. Upload CleanVideoBrowser_v1.1.0_Source.zip at repository root, and put the YML under .github/workflows/.')

          for f in ('settings.gradle', 'build.gradle', 'app/build.gradle', 'tests/verify_project.py'):
              if not (target / f).is_file():
                  raise RuntimeError('Missing required CleanVideoBrowser project file: ' + f)
          if "rootProject.name = 'CleanVideoBrowser'" not in (target / 'settings.gradle').read_text():
              raise RuntimeError('Wrong app project in archive: expected CleanVideoBrowser')
          print('CLEANVIDEOBROWSER_PROJECT_READY:', target)
          PYUNZIP

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android 35 platform and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify CleanVideoBrowser source
        working-directory: .cleanvideobrowser-build
        shell: bash
        run: |
          python3 tests/verify_project.py
          java tests/JavaSyntaxCheck.java $(find app/src/main/java -name '*.java')
          python3 tests/offline_regression.py

      - name: Build CleanVideoBrowser debug APK
        working-directory: .cleanvideobrowser-build
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload CleanVideoBrowser v1.1.0 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CleanVideoBrowser_v1.1.0_APK
          path: .cleanvideobrowser-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
