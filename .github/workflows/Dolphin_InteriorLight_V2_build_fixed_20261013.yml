name: Build Dolphin Interior Light V2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dolphin_InteriorLight_V2_Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack the single uploaded source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f Dolphin_InteriorLight_V2_Source.zip
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          source = Path('Dolphin_InteriorLight_V2_Source.zip')
          destination = Path('.dolphin-build')
          destination.mkdir(exist_ok=True)
          with zipfile.ZipFile(source) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f'ZIP CRC error: {bad}')
              for info in archive.infolist():
                  name = Path(info.filename)
                  if name.is_absolute() or '..' in name.parts:
                      raise SystemExit(f'Unsafe ZIP member: {info.filename}')
                  if info.filename.startswith('.github/'):
                      raise SystemExit('Source ZIP must not include a second workflow YAML')
              archive.extractall(destination)
          for needed in ('settings.gradle', 'build.gradle', 'app/build.gradle', 'tests/check_source_safety.py'):
              if not (destination / needed).is_file():
                  raise SystemExit(f'Missing project file: {needed}')
          (destination / '.github/workflows').mkdir(parents=True, exist_ok=True)
          (destination / '.github/workflows/build-apk.yml').write_bytes(
              Path('.github/workflows/build-apk.yml').read_bytes()
          )
          print('Unpacked and validated project:', destination)
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-android@v3 requests the discontinued legacy SDK "tools" package.
      # v4 installs modern command-line tools and only the requested valid packages.
      - name: Setup Android SDK (no legacy tools)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 2>&1 | tee .dolphin-build/sdk_install.log
          sdkmanager --list_installed 2>&1 | tee -a .dolphin-build/sdk_install.log

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run source checks
        working-directory: .dolphin-build
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/check_source_safety.py | tee static_gate.log

      - name: Build test APK
        working-directory: .dolphin-build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Dolphin-InteriorLight-V2-Test-APK
          path: .dolphin-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs if build failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-InteriorLight-V2-Build-Logs
          path: |
            .dolphin-build/sdk_install.log
            .dolphin-build/static_gate.log
            .dolphin-build/build.log
          if-no-files-found: warn
