name: MideumHanaTube v0.1.15 automatic debug APK (no secrets)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Find MideumHanaTube project
        shell: bash
        run: |
          set -euo pipefail
          SRC=MideumHanaTube_v0.1.15_Source.zip
          if [[ -f "$SRC" ]]; then
            mkdir -p mht-build-project
            unzip -q -o "$SRC" -d mht-build-project
            PROJECT_DIR=mht-build-project
          elif [[ -f app/build.gradle && -f settings.gradle && -f tools/test-v0115-home-audio.sh ]]; then
            PROJECT_DIR=.
          else
            echo '::error::Missing MideumHanaTube source ZIP or unpacked project.'; exit 1
          fi
          grep -q "applicationId 'app.mideumhanatube.android'" "$PROJECT_DIR/app/build.gradle" || exit 1
          grep -q "versionCode 16" "$PROJECT_DIR/app/build.gradle" || exit 1
          grep -q "versionName '0.1.15'" "$PROJECT_DIR/app/build.gradle" || exit 1
          echo "MHT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          test -x "$SDKMANAGER" || { echo '::error::sdkmanager not found'; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Test AndroidX, player state, diagnostics and UI
        shell: bash
        run: |
          set -euo pipefail
          for test in "$MHT_DIR"/tools/test-*.sh; do
            echo "Running $test"
            bash "$test"
          done
      - name: Build automatically signed debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$MHT_DIR"
          # Android Gradle Plugin automatically creates a runner-local debug keystore.
          # No GitHub Secrets or user-managed signing key needed.
          gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK signature and version
        shell: bash
        run: |
          set -euo pipefail
          APK="$MHT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          TOOL="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$TOOL" verify --verbose "$APK"
          "$TOOL" verify --print-certs "$APK" | grep -i 'certificate SHA-256 digest:'
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -1)"
          echo "$BADGING"
          [[ "$BADGING" == *"app.mideumhanatube.android"* && "$BADGING" == *"versionCode='16'"* ]] || {
            echo '::error::Package ID or versionCode mismatch'; exit 1;
          }
          mkdir -p dist
          cp "$APK" dist/MideumHanaTube_v0.1.15_Debug.apk
      - name: Upload automatically signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MideumHanaTube_v0.1.15_Debug_APK
          path: dist/MideumHanaTube_v0.1.15_Debug.apk
          if-no-files-found: error
          retention-days: 30
