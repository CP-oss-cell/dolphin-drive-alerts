name: Build BYD Dolphin GLES3 Real-View APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip byd_dolphin_realbowl.zip
        run: |
          mkdir -p src_build
          unzip -o byd_dolphin_realbowl.zip -d src_build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (API 33)
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-33 build-tools;33.0.2"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Native GLES3 ARM64 Release APK
        working-directory: src_build
        run: gradle :app:assembleRelease --no-daemon

      - name: Package APK & ADB UID 2000 HAL Bridge DEX
        run: |
          mkdir -p dist
          cp src_build/app/build/outputs/apk/release/app-release.apk dist/byd_dolphin_realbowl.apk
          unzip -p dist/byd_dolphin_realbowl.apk classes.dex > dist/byd_reality_bridge.dex
          ls -lh dist/

      - name: Upload APK & DEX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: byd_dolphin_realbowl_apk
          path: |
            dist/byd_dolphin_realbowl.apk
            dist/byd_reality_bridge.dex
