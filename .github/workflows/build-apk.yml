name: Build BYD Dolphin FSD 15 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip source.zip
        run: |
          mkdir -p src_build
          unzip -o source.zip -d src_build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (API 33)
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-33 build-tools;33.0.2"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build ARM64 Release APK
        working-directory: src_build
        run: gradle :app:assembleRelease --no-daemon

      - name: Package APK & ADB Bridge DEX
        run: |
          mkdir -p dist
          cp src_build/app/build/outputs/apk/release/app-release.apk dist/byd-dolphin-fsd15-reality-view.apk
          unzip -p dist/byd-dolphin-fsd15-reality-view.apk classes.dex > dist/byd_reality_bridge.dex
          ls -lh dist/

      - name: Upload APK & DEX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: byd-dolphin-fsd15-apk
          path: |
            dist/byd-dolphin-fsd15-reality-view.apk
            dist/byd_reality_bridge.dex
