name: Build DolphinSMS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract DolphinSMS source zip
        run: |
          mkdir -p build_src
          unzip -q -o DolphinSMS-source.zip -d build_src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        working-directory: build_src
        run: gradle assembleRelease

      - name: Prepare APK file
        run: cp build_src/app/build/outputs/apk/release/app-release.apk DolphinSMS.apk

      - name: Upload DolphinSMS APK
        uses: actions/upload-artifact@v4
        with:
          name: DolphinSMS-APK
          path: DolphinSMS.apk
          if-no-files-found: error
