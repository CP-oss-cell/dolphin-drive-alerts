name: Build Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v3 used the removed Android SDK "tools" package and failed before Gradle.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Static validation
        run: |
          python3 tests/verify_project.py
          java tests/JavaSyntaxCheck.java $(find app/src/main/java -name '*.java')

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanVideoBrowser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
