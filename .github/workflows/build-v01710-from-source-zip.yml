name: Build Dolphin Drive Alerts v0.17.10 Bridge Return Fix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'DolphinDriveAlerts-v0.17.10-BRIDGE-RETURN-FIX-source.zip'
      - '.github/workflows/build-v01710-from-source-zip.yml'

permissions:
  contents: read

env:
  SOURCE_ZIP: DolphinDriveAlerts-v0.17.10-BRIDGE-RETURN-FIX-source.zip

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP"
          echo "Using source: $SOURCE_ZIP"
          sha256sum "$SOURCE_ZIP"

      - name: Extract v0.17.10 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _build_src
          mkdir -p _build_src
          unzip -q "$SOURCE_ZIP" -d _build_src
          PROJECT_ROOT="$(find "$GITHUB_WORKSPACE/_build_src" -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_ROOT" ]; then
            echo 'ERROR: settings.gradle.kts not found after extracting source ZIP'
            find _build_src -maxdepth 4 -type f | sort | head -200
            exit 1
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_ROOT"
          ls -la "$PROJECT_ROOT"

      - name: Preflight APK distribution files (before expensive build)
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            INTEGRATION_V0173_EQ_SOUND_FOCUS_KO.md \
            INTEGRATION_V0175_CAPTURE_RECONNECT_KO.md \
            INTEGRATION_V0177_EQ_SDK_API_FIX_KO.md \
            INTEGRATION_V0178_COMPREHENSIVE_FIX_KO.md \
            INTEGRATION_V0179_OEM_SIGNAL_RECOVERY_KO.md \
            AVAS_LOG_ANALYSIS_20261009.json \
            STATIC_GATES_V0179.log \
            BUILD_UPLOAD_V0179_KO.md \
            GITHUB_BUILD_FAILURE_V0179_TO_V01710_KO.md \
            INTEGRATION_V01710_BRIDGE_RETURN_FIX_KO.md \
            STATIC_GATES_V01710.log \
            BUILD_UPLOAD_V01710_KO.md; do
            if [ ! -f "$PROJECT_ROOT/$name" ]; then
              echo "::error file=$name::Required APK distribution file missing in source ZIP"
              exit 1
            fi
          done
          echo "Required APK distribution documents: all present"

      - name: Preflight explicit return in OEM ReferenceBridge (before voice generation)
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          python3 tools/verify_v01710_reference_bridge_contract.py

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install voice-generation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install edge-tts==7.2.8

      - name: Generate and verify 60 Korean voice assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          python tools/generate_voice_pack.py --force
          python tools/verify_voice_pack.py
          COUNT="$(find app/src/main/assets/voice -type f -name '*.wav' | wc -l | tr -d ' ')"
          echo "voice wav count=$COUNT"
          test "$COUNT" = '60'

      - name: Verify v0.17.8 and v0.17.9 unchanged functionality
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          python tools/verify_v0178_integration.py
          python tools/verify_v0179_integration.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify actual EQ Kotlin source against Android API contract stubs
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          if command -v kotlinc >/dev/null 2>&1 && command -v javac >/dev/null 2>&1; then
            python tools/verify_v0177_eq_kotlin_compile.py
            python tools/verify_v0178_media_kotlin_compile.py
            python tools/verify_v0179_oem_kotlin_compile.py
            python tools/verify_v0179_callback_kotlin_compile.py
            python tools/verify_v01710_reference_bridge_kotlin.py
          else
            echo 'kotlinc unavailable: Gradle :app:compileDebugKotlin will verify full Android API on this runner'
          fi

      - name: Resolve preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses and install API 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
          test -f "$ANDROID_SDK_ROOT/platforms/android-34/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2"
          echo "Android API 34 / Build Tools 34.0.0 ready"

      - name: Restore persistent debug signing certificate if configured
        shell: bash
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DOLPHIN_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo 'Persistent debug signing keystore restored from GitHub secret (not printed)'
          else
            echo '::warning::DOLPHIN_DEBUG_KEYSTORE_B64 not configured; temporary runner debug signing may differ from installed APK, and in-place updates can fail'
          fi

      - name: Compile real Android Kotlin with API 34 (authoritative regression gate)
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --warning-mode all :app:compileDebugKotlin | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleDebug | tee -a "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Package APK and verification files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify "$APK"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | grep -E 'Signer #1 certificate (SHA-256 digest|DN):' || true
          cp "$APK" "$GITHUB_WORKSPACE/dist/DolphinDriveAlerts-v0.17.10-BRIDGE-RETURN-FIX.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/DolphinDriveAlerts-v0.17.10-BRIDGE-RETURN-FIX.apk" > "$GITHUB_WORKSPACE/dist/DolphinDriveAlerts-v0.17.10-BRIDGE-RETURN-FIX.apk.sha256"
          cp "$PROJECT_ROOT/INTEGRATION_V0173_EQ_SOUND_FOCUS_KO.md" "$GITHUB_WORKSPACE/dist/"
          cp "$PROJECT_ROOT/INTEGRATION_V0175_CAPTURE_RECONNECT_KO.md" "$GITHUB_WORKSPACE/dist/"
          cp "$PROJECT_ROOT/INTEGRATION_V0177_EQ_SDK_API_FIX_KO.md" "$GITHUB_WORKSPACE/dist/"
          cp "$PROJECT_ROOT/INTEGRATION_V0178_COMPREHENSIVE_FIX_KO.md" "$GITHUB_WORKSPACE/dist/"
          cp "$PROJECT_ROOT/INTEGRATION_V0179_OEM_SIGNAL_RECOVERY_KO.md" "$GITHUB_WORKSPACE/dist/"
          cp "$PROJECT_ROOT/AVAS_LOG_ANALYSIS_20261009.json" "$GITHUB_WORKSPACE/dist/"
          cp "$PROJECT_ROOT/STATIC_GATES_V0179.log" "$GITHUB_WORKSPACE/dist/"
          cp "$PROJECT_ROOT/BUILD_UPLOAD_V0179_KO.md" "$GITHUB_WORKSPACE/dist/"
          cp "$PROJECT_ROOT/GITHUB_BUILD_FAILURE_V0179_TO_V01710_KO.md" "$GITHUB_WORKSPACE/dist/"
          cp "$PROJECT_ROOT/INTEGRATION_V01710_BRIDGE_RETURN_FIX_KO.md" "$GITHUB_WORKSPACE/dist/"
          cp "$PROJECT_ROOT/STATIC_GATES_V01710.log" "$GITHUB_WORKSPACE/dist/"
          cp "$PROJECT_ROOT/BUILD_UPLOAD_V01710_KO.md" "$GITHUB_WORKSPACE/dist/"
          cp "$PROJECT_ROOT/AUTOSTART_STATUS_KO.md" "$GITHUB_WORKSPACE/dist/" || true
          cp "$PROJECT_ROOT/BUILD_AND_VALIDATION_STATUS_KO.txt" "$GITHUB_WORKSPACE/dist/" || true
          cp "$PROJECT_ROOT/app/src/main/assets/voice/voice_pack_manifest.generated.json" "$GITHUB_WORKSPACE/dist/" || true
          cp "$GITHUB_WORKSPACE/gradle-build.log" "$GITHUB_WORKSPACE/dist/" || true
          echo '--- dist ---'
          ls -lah "$GITHUB_WORKSPACE/dist"
          echo '--- APK SHA256 ---'
          cat "$GITHUB_WORKSPACE/dist/DolphinDriveAlerts-v0.17.10-BRIDGE-RETURN-FIX.apk.sha256"

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DolphinDriveAlerts-v0.17.10-BRIDGE-RETURN-FIX
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DolphinDriveAlerts-v0.17.10-build-failure-log
          path: |
            gradle-build.log
            _build_src/**/BUILD_AND_VALIDATION_STATUS_KO.txt
          if-no-files-found: ignore
          retention-days: 14
