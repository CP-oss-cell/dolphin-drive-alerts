name: BYD Dolphin Good Lock v0.3 Access Gates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK without deprecated tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Ensure Android API 34
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME unset}"
          command -v sdkmanager
          if [[ ! -s "$ANDROID_HOME/platforms/android-34/android.jar" || ! -x "$ANDROID_HOME/build-tools/34.0.0/aapt" ]]; then
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          fi
          test -s "$ANDROID_HOME/platforms/android-34/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt"
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unpack isolated source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s DolphinGoodLockProbe-v0.3.0-source.zip
          mkdir -p "$RUNNER_TEMP/goodlock-v03"
          unzip -oq DolphinGoodLockProbe-v0.3.0-source.zip -d "$RUNNER_TEMP/goodlock-v03"
          test -f "$RUNNER_TEMP/goodlock-v03/app/build.gradle"
          python3 "$RUNNER_TEMP/goodlock-v03/tools/verify_source.py" "$RUNNER_TEMP/goodlock-v03"
      - name: Java source syntax parse check
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/goodlock-v03"
          mkdir -p "$RUNNER_TEMP/parser"
          javac -d "$RUNNER_TEMP/parser" "$ROOT/tools/ParseJava.java"
          java -cp "$RUNNER_TEMP/parser" ParseJava "$ROOT"/app/src/main/java/com/dolphin/goodlock/probe/*.java
      - name: Android Gradle debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p "$RUNNER_TEMP/goodlock-v03" --stacktrace :app:assembleDebug
      - name: Verify package, no Android permissions, export APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/goodlock-v03/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee dist/apk-badging.txt
          grep -q "package: name='com.dolphin.goodlock.probe.v03'" dist/apk-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$APK" | tee dist/apk-permissions.txt
          if grep -q 'uses-permission' dist/apk-permissions.txt; then echo 'Unexpected uses-permission'; exit 1; fi
          cp "$APK" dist/DolphinGoodLockProbe-v0.3.0-DEBUG.apk
          sha256sum dist/DolphinGoodLockProbe-v0.3.0-DEBUG.apk > dist/SHA256SUMS.txt
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DolphinGoodLockProbe-v0.3.0-APK
          path: dist/*
          if-no-files-found: error
