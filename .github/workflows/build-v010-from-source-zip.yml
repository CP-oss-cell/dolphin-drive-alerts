name: Build Dolphin Drive Alerts v0.10 APK from source ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'DolphinDriveAlerts-v0.10-DIAGNOSTIC-CAPTURE-source.zip'
      - '.github/workflows/build-v010-from-source-zip.yml'

permissions:
  contents: read

env:
  SOURCE_ZIP: DolphinDriveAlerts-v0.10-DIAGNOSTIC-CAPTURE-source.zip

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP"
          echo "Using source: $SOURCE_ZIP"
          sha256sum "$SOURCE_ZIP"

      - name: Extract v0.10 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _build_src
          mkdir -p _build_src
          unzip -q "$SOURCE_ZIP" -d _build_src

          PROJECT_ROOT="$(find "$GITHUB_WORKSPACE/_build_src" -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_ROOT" ]; then
            echo 'ERROR: settings.gradle.kts not found after extracting source ZIP'
            find _build_src -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_ROOT"
          ls -la "$PROJECT_ROOT"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install voice-generation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install edge-tts==7.2.8

      - name: Generate and verify 60 Korean voice assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          python tools/generate_voice_pack.py --force
          python tools/verify_voice_pack.py
          COUNT="$(find app/src/main/assets/voice -type f -name '*.wav' | wc -l | tr -d ' ')"
          echo "voice wav count=$COUNT"
          test "$COUNT" = '60'

      - name: Verify v0.10 diagnostic safety gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          python tools/verify_diagnostic_v010.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'

      - name: Build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean :app:assembleDebug

      - name: Package APK and verification files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/dist/DolphinDriveAlerts-v0.10-DIAGNOSTIC-CAPTURE.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/DolphinDriveAlerts-v0.10-DIAGNOSTIC-CAPTURE.apk" \
            > "$GITHUB_WORKSPACE/dist/DolphinDriveAlerts-v0.10-DIAGNOSTIC-CAPTURE.apk.sha256"

          cp "$PROJECT_ROOT/VALIDATION_RESULTS_0.10.txt" "$GITHUB_WORKSPACE/dist/" || true
          cp "$PROJECT_ROOT/BUILD_AND_VALIDATION_STATUS_KO.txt" "$GITHUB_WORKSPACE/dist/" || true
          cp "$PROJECT_ROOT/EVIDENCE_REGISTRY_V010.md" "$GITHUB_WORKSPACE/dist/" || true
          cp "$PROJECT_ROOT/app/src/main/assets/voice/voice_pack_manifest.generated.json" "$GITHUB_WORKSPACE/dist/" || true

          echo '--- dist ---'
          ls -lah "$GITHUB_WORKSPACE/dist"
          echo '--- APK SHA256 ---'
          cat "$GITHUB_WORKSPACE/dist/DolphinDriveAlerts-v0.10-DIAGNOSTIC-CAPTURE.apk.sha256"

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DolphinDriveAlerts-v0.10-DIAGNOSTIC-CAPTURE
          path: dist/*
          if-no-files-found: error
          retention-days: 30
