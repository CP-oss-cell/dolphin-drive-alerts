name: Build Dolphin Drive Alerts v0.10 APK from source ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'DolphinDriveAlerts-v0.10-DIAGNOSTIC-CAPTURE-source.zip'
      - '.github/workflows/build-v010-from-source-zip.yml'

permissions:
  contents: read

env:
  SOURCE_ZIP: DolphinDriveAlerts-v0.10-DIAGNOSTIC-CAPTURE-source.zip

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP"
          echo "Using source: $SOURCE_ZIP"
          sha256sum "$SOURCE_ZIP"

      - name: Extract v0.10 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _build_src
          mkdir -p _build_src
          unzip -q "$SOURCE_ZIP" -d _build_src

          PROJECT_ROOT="$(find "$GITHUB_WORKSPACE/_build_src" -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_ROOT" ]; then
            echo 'ERROR: settings.gradle.kts not found after extracting source ZIP'
            find _build_src -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_ROOT"
          ls -la "$PROJECT_ROOT"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install voice-generation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install edge-tts==7.2.8

      - name: Generate and verify 60 Korean voice assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          python tools/generate_voice_pack.py --force
          python tools/verify_voice_pack.py
          COUNT="$(find app/src/main/assets/voice -type f -name '*.wav' | wc -l | tr -d ' ')"
          echo "voice wav count=$COUNT"
          test "$COUNT" = '60'

      - name: Verify v0.10 diagnostic safety gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          python tools/verify_diagnostic_v010.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # IMPORTANT: Do NOT use android-actions/setup-android@v3 here.
      # On the current GitHub Ubuntu runner it invokes `sdkmanager tools`,
      # but the obsolete `tools` package is no longer available and the job exits 1.
      - name: Resolve preinstalled Android SDK
        shell: bash
