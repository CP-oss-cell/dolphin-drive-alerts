name: Build DolphinComms APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack DolphinComms.zip
        run: |
          unzip -q DolphinComms.zip -d work_src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        working-directory: work_src
        run: gradle assembleRelease --no-daemon

      - name: Upload DolphinComms APK
        uses: actions/upload-artifact@v4
        with:
          name: DolphinComms-apk
          path: work_src/app/build/outputs/apk/release/*.apk
