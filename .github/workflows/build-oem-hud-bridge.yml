name: Build Dolphin OEM HUD Bridge v0.9.1 (ZIP + YML)
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'Dolphin_OEM_HUD_Bridge_v0.9.1_SOURCE.zip'
      - '.github/workflows/build-oem-hud-bridge.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hud-bridge-build
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract the source ZIP (isolated from existing repo files)
        working-directory: .
        run: |
          set -euo pipefail
          unzip -t 'Dolphin_OEM_HUD_Bridge_v0.9.1_SOURCE.zip' >/dev/null
          mkdir -p hud-bridge-build/.github/workflows
          unzip -oq 'Dolphin_OEM_HUD_Bridge_v0.9.1_SOURCE.zip' -d hud-bridge-build
          cp .github/workflows/build-oem-hud-bridge.yml hud-bridge-build/.github/workflows/build-oem-hud-bridge.yml
          test -s hud-bridge-build/app/build.gradle
          test -s hud-bridge-build/tools/preflight.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Check project and AndroidManifest preflight
        run: python3 tools/preflight.py
      - name: Run parser and HUD protocol tests
        run: bash tools/run_jvm_tests.sh
      - name: Exercise simulated Android broadcast-to-HUD flow
        run: bash tools/run_service_simulation.sh
      - name: Exercise BLE transport with simulated GATT
        run: bash tools/run_ble_simulation.sh
      - name: Exercise actual service plus actual BLE connector
        run: bash tools/run_integrated_simulation.sh
      - name: Type-check dashboard Java against offline UI stubs
        run: bash tools/run_dashboard_typecheck.sh
      - name: Syntax-check ADB Kotlin source where standalone compiler is available
        run: bash tools/run_adb_kotlin_syntax.sh
      - name: Verify CI Java-resource packaging rules
        run: python3 tools/check_packaging_ci_fix.py
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Confirm APK produced
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DolphinOemHudBridge-v0.9.1-CI-FIX-debug
          path: hud-bridge-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
