name: Build Dolphin Drive Alerts FINAL 0.7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Unpack FINAL source ZIP
        run: |
          rm -rf _src
          mkdir _src
          unzip -q DolphinDriveAlerts_FINAL_v0.7_source.zip -d _src
          test -f _src/DolphinDriveAlertsCore/gradlew

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install voice generator
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install edge-tts==7.2.8

      - name: Generate and verify 60 Korean WAV files
        working-directory: _src/DolphinDriveAlertsCore
        run: |
          python tools/generate_voice_pack.py --force
          python tools/verify_voice_pack.py
          COUNT="$(find app/src/main/assets/voice -type f -name '*.wav' | wc -l)"
          echo "voice wav count=$COUNT"
          test "$COUNT" -eq 60

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: _src/DolphinDriveAlertsCore/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'

      - name: Build APK
        working-directory: _src/DolphinDriveAlertsCore
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:assembleDebug

      - name: Package APK and generated source
        working-directory: _src/DolphinDriveAlertsCore
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DolphinDriveAlerts-v0.7-FINAL-realcar.apk
          sha256sum dist/DolphinDriveAlerts-v0.7-FINAL-realcar.apk > dist/DolphinDriveAlerts-v0.7-FINAL-realcar.apk.sha256
          cp app/src/main/assets/voice/voice_pack_manifest.generated.json dist/
          zip -qr dist/DolphinDriveAlerts-v0.7-FINAL-generated-source.zip . \
            -x '.git/*' 'dist/*' '.gradle/*' 'app/build/*' 'build/*' 'tools/__pycache__/*'
          sha256sum dist/DolphinDriveAlerts-v0.7-FINAL-generated-source.zip > dist/DolphinDriveAlerts-v0.7-FINAL-generated-source.zip.sha256

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: DolphinDriveAlerts-v0.7-FINAL-realcar
          path: _src/DolphinDriveAlertsCore/dist/*
          if-no-files-found: error
          retention-days: 30
