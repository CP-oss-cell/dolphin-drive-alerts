# CleanVideoBrowser-only workflow; do not name this build-apk.yml.
name: CleanVideoBrowser v1.0.2 APK
run-name: CleanVideoBrowser v1.0.2 / APK build

on:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/CleanVideoBrowser_v1.0.2_Source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cleanvideobrowser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    name: CleanVideoBrowser / build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout CleanVideoBrowser sources
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK (no obsolete tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android 35 platform and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project inputs
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          python3 tests/verify_project.py
          java tests/JavaSyntaxCheck.java $(find app/src/main/java -name '*.java')

      - name: Build APK (detailed failures)
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload CleanVideoBrowser debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CleanVideoBrowser_v1.0.2_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
