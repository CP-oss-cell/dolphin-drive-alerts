          """
          packed = source.read_bytes() if source.is_file() else base64.b64decode(
              ''.join(bundled.split()), validate=True)
          digest = hashlib.sha256(packed).hexdigest()
          if digest != expected_sha256:
              raise RuntimeError('믿음하나 브라우저 소스 ZIP과 YML 버전/해시가 일치하지 않습니다')
          with ZipFile(BytesIO(packed)) as archive:
              if archive.testzip() is not None: raise RuntimeError('잘못된 소스 ZIP 파일')
              for item in archive.infolist():
                  relative = Path(item.filename.replace('\\', '/'))
                  if relative.is_absolute() or '..' in relative.parts or relative.drive:
                      raise RuntimeError('ZIP 파일의 위험한 경로: '+item.filename)
                  if (item.external_attr >> 16) & 0o170000 == stat.S_IFLNK:
                      raise RuntimeError('ZIP 심볼릭 링크 차단')
                  output = (dest / relative).resolve()
                  if not output.is_relative_to(dest): raise RuntimeError('ZIP 추출 경로 차단')
                  if item.is_dir(): output.mkdir(parents=True,exist_ok=True)
                  else:
                      output.parent.mkdir(parents=True,exist_ok=True)
                      with archive.open(item) as inp, output.open('wb') as target:
                          shutil.copyfileobj(inp,target)
          for path in ('settings.gradle','build.gradle','app/build.gradle','tests/verify_project.py'):
              if not (dest/path).is_file(): raise RuntimeError('필수 소스 누락: '+path)
          gradle = (dest/'app/build.gradle').read_text()
          if "applicationId 'com.mideumhana.browser'" not in gradle or "versionName '2.1.2'" not in gradle or 'versionCode 8' not in gradle:
              raise RuntimeError('잘못된 소스 버전')
          print('SOURCE_RESTORED', 'repository-zip' if source.is_file() else 'embedded-yml',digest)
          PYUNZIP

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android platform and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run source regressions and resume rule unit tests
        shell: bash
        working-directory: .mideumhana-browser-build
        run: |
          set -euo pipefail
          python3 tests/verify_project.py
          java tests/JavaSyntaxCheck.java $(find app/src/main/java -name '*.java')
          for t in tests/*regression.py; do python3 "$t"; done
          mkdir -p /tmp/mhb-java-test
          javac --release 17 -d /tmp/mhb-java-test \
            app/src/main/java/com/mideumhana/browser/TransferIntegrity.java \
            tests/TransferIntegrityTest.java
          java -cp /tmp/mhb-java-test com.mideumhana.browser.TransferIntegrityTest

      - name: Require one permanent release signing key
        shell: bash
        env:
          MHB_KEYSTORE_BASE64: ${{ secrets.MHB_KEYSTORE_BASE64 }}
          MHB_SIGNING_PASSWORD: ${{ secrets.MHB_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$MHB_KEYSTORE_BASE64" || -z "$MHB_SIGNING_PASSWORD" ]]; then
            echo '::error::업데이트 가능한 v2.1.2 최초 설치를 위해 MHB_KEYSTORE_BASE64와 MHB_KEYSTORE_PASSWORD Secrets를 모두 등록해야 합니다. Debug APK를 대신 만들지 않습니다.'
            exit 1
          fi

      - name: Build verified release APK
        id: apk
        shell: bash
        working-directory: .mideumhana-browser-build
        env:
          MHB_KEYSTORE_BASE64: ${{ secrets.MHB_KEYSTORE_BASE64 }}
          MHB_SIGNING_PASSWORD: ${{ secrets.MHB_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          export MHB_SIGNING_KEYSTORE_PATH="${RUNNER_TEMP}/mideumhana-release.jks"
          printf '%s' "$MHB_KEYSTORE_BASE64" | base64 --decode > "$MHB_SIGNING_KEYSTORE_PATH"
          chmod 600 "$MHB_SIGNING_KEYSTORE_PATH"
          keytool -list -keystore "$MHB_SIGNING_KEYSTORE_PATH" -alias mideumhana -storepass "$MHB_SIGNING_PASSWORD" >/dev/null
          gradle --no-daemon --stacktrace :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > /tmp/mhb-apk-signature.txt
          grep 'Signer #1 certificate SHA-256 digest' /tmp/mhb-apk-signature.txt >> "$GITHUB_STEP_SUMMARY"
          echo "apk_path=.mideumhana-browser-build/$apk" >> "$GITHUB_OUTPUT"
          echo 'kind=Release' >> "$GITHUB_OUTPUT"
          echo 'v2.1.2는 새 설치 기준본입니다. 다음 버전도 동일 키스토어+alias를 사용해야 업데이트됩니다.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MideumHanaBrowser_v2.1.2_Release_APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
