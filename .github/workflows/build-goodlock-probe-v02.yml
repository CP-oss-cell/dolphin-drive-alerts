name: BYD Dolphin Good Lock Guided Probe v0.2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install API 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unpack standalone guided probe
        run: |
          test -s DolphinGoodLockProbe-v0.2.0-source.zip
          mkdir -p guided-src
          unzip -oq DolphinGoodLockProbe-v0.2.0-source.zip -d guided-src
          test -f guided-src/tools/verify_source.py
          python3 guided-src/tools/verify_source.py guided-src
      - name: Android Gradle assembleDebug
        run: |
          cd guided-src
          gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK package permissions and size
        run: |
          set -euo pipefail
          APK=guided-src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.dolphin.goodlock.probe'" apk-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$APK" | tee apk-permissions.txt
          if grep -q 'uses-permission' apk-permissions.txt; then
            echo 'Unexpected declared permission!'; exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/DolphinGoodLockProbe-v0.2.0-debug.apk
          cp apk-badging.txt apk-permissions.txt dist/
          sha256sum dist/DolphinGoodLockProbe-v0.2.0-debug.apk > dist/SHA256SUMS.txt
      - name: Upload installation APK
        uses: actions/upload-artifact@v4
        with:
          name: DolphinGoodLockProbe-v0.2.0-APK
          path: dist/*
          if-no-files-found: error
