                  if relative.is_absolute() or '..' in relative.parts or relative.drive:
                      raise RuntimeError('ZIP 파일의 위험한 경로: '+item.filename)
                  if (item.external_attr >> 16) & 0o170000 == stat.S_IFLNK:
                      raise RuntimeError('ZIP 심볼릭 링크 차단')
                  output = (dest / relative).resolve()
                  if not output.is_relative_to(dest): raise RuntimeError('ZIP 추출 경로 차단')
                  if item.is_dir(): output.mkdir(parents=True,exist_ok=True)
                  else:
                      output.parent.mkdir(parents=True,exist_ok=True)
                      with archive.open(item) as inp, output.open('wb') as target:
                          shutil.copyfileobj(inp,target)
          for path in ('settings.gradle','build.gradle','app/build.gradle','tests/verify_project.py'):
              if not (dest/path).is_file(): raise RuntimeError('필수 소스 누락: '+path)
          gradle = (dest/'app/build.gradle').read_text()
          if "applicationId 'com.mideumhana.browser'" not in gradle or "versionName '2.1.7'" not in gradle or 'versionCode 13' not in gradle:
              raise RuntimeError('잘못된 소스 버전')
          print('SOURCE_RESTORED', 'repository-zip' if source.is_file() else 'embedded-yml',digest)
          PYUNZIP

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android platform and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run source regressions and resume rule unit tests
        shell: bash
        working-directory: .mideumhana-browser-build
        run: |
          set -euo pipefail
          python3 tests/verify_project.py
          java tests/JavaSyntaxCheck.java $(find app/src/main/java -name '*.java')
          for t in tests/*regression.py; do python3 "$t"; done
          mkdir -p /tmp/mhb-java-test
          javac --release 17 -d /tmp/mhb-java-test \
            app/src/main/java/com/mideumhana/browser/TransferIntegrity.java \
            tests/TransferIntegrityTest.java
          java -cp /tmp/mhb-java-test com.mideumhana.browser.TransferIntegrityTest

      - name: Build automatically signed Debug APK (no Secrets)
        id: apk
        shell: bash
        working-directory: .mideumhana-browser-build
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > /tmp/mhb-debug-signature.txt
          echo "apk_path=.mideumhana-browser-build/$apk" >> "$GITHUB_OUTPUT"
          echo 'Debug APK 자동 서명 완료. 기존 앱과 서명이 다른 경우 삭제 후 설치하세요. 앱 내부 데이터가 삭제될 수 있습니다.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MideumHanaBrowser_v2.1.7_Debug_APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
