name: Build Dolphin Cluster V1.6 Automatic Read-only Capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v16-auto:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLUSTER_KEYSTORE_B64: ${{ secrets.CLUSTER_KEYSTORE_B64 }}
      CLUSTER_STORE_PASSWORD: ${{ secrets.CLUSTER_STORE_PASSWORD }}
      CLUSTER_KEY_ALIAS: ${{ secrets.CLUSTER_KEY_ALIAS }}
      CLUSTER_KEY_PASSWORD: ${{ secrets.CLUSTER_KEY_PASSWORD }}
    steps:
      - name: Checkout manually uploaded source ZIP
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (no deprecated tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract independent cluster wizard project
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='DolphinClusterReadOnlyTrial-v1.6-source.zip'
          test -f "$SOURCE"
          OUT="$RUNNER_TEMP/cluster-v16"
          mkdir -p "$OUT"
          unzip -q "$SOURCE" -d "$OUT"
          test -f "$OUT/settings.gradle"
          test -f "$OUT/app/src/main/java/com/dolphin/clusterprobe/StageWizardActivity.java"
          test -f "$OUT/app/src/main/java/com/dolphin/clusterprobe/LocalAdb.java"
          # Fail immediately if the manually uploaded ZIP is not the verified Dolphin Cluster app.
          grep -Eq "applicationId[[:space:]]+'com[.]dolphin[.]clusterprobe[.]v15'" "$OUT/app/build.gradle"
          grep -Fq 'android:label="돌핀 계기판 자동진단 V1.6"' "$OUT/app/src/main/AndroidManifest.xml"
          grep -Fq 'android.intent.action.MAIN' "$OUT/app/src/main/AndroidManifest.xml"
          test -f "$OUT/app/src/main/java/com/dolphin/clusterprobe/MainActivity.java"
          test -f "$OUT/app/src/main/java/com/dolphin/clusterprobe/StageWizardActivity.java"
          test -f "$OUT/app/src/main/java/com/dolphin/clusterprobe/LocalAdb.java"
      - name: Read-only flow and candidate tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cluster-v16"
          javac -d /tmp/wizard-java-tests app/src/main/java/com/dolphin/clusterprobe/CandidateParser.java app/src/main/java/com/dolphin/clusterprobe/ProbeCatalog.java tools/TestCandidateParser.java
          java -cp /tmp/wizard-java-tests TestCandidateParser
          python3 tools/test_v16_contract.py
          python3 tools/test_zip_share_static.py
          python3 tools/test_local_adb_mock.py
          python3 tools/test_local_adb_retry.py
          python3 tools/test_local_adb_session.py
      - name: Optional permanent signing key (for later same-package updates)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$CLUSTER_KEYSTORE_B64" && -n "$CLUSTER_STORE_PASSWORD" && -n "$CLUSTER_KEY_ALIAS" && -n "$CLUSTER_KEY_PASSWORD" ]]; then
            SIGN_FILE="$RUNNER_TEMP/cluster-v16-signing.jks"
            printf '%s' "$CLUSTER_KEYSTORE_B64" | base64 --decode > "$SIGN_FILE"
            chmod 600 "$SIGN_FILE"
            echo "CLUSTER_SIGNING_STORE=$SIGN_FILE" >> "$GITHUB_ENV"
            echo 'CLUSTER_SIGNING_MODE=release' >> "$GITHUB_ENV"
          elif [[ -z "$CLUSTER_KEYSTORE_B64" && -z "$CLUSTER_STORE_PASSWORD" && -z "$CLUSTER_KEY_ALIAS" && -z "$CLUSTER_KEY_PASSWORD" ]]; then
            echo 'CLUSTER_SIGNING_MODE=debug' >> "$GITHUB_ENV"
            echo 'NOTICE: Debug signing uses ephemeral CI keys; future updates require consistent signing.'
          else
            echo 'ERROR: Configure all four signing secrets or none.' >&2
            exit 1
          fi
      - name: Compile Android app
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CLUSTER_SIGNING_MODE" == release ]]; then
            gradle --no-daemon -p "$RUNNER_TEMP/cluster-v16" :app:assembleRelease
          else
            gradle --no-daemon -p "$RUNNER_TEMP/cluster-v16" :app:assembleDebug
          fi
      - name: Package generated APK and hash
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cluster-v16-artifact"
          mkdir -p "$OUT"
          if [[ "$CLUSTER_SIGNING_MODE" == release ]]; then
            cp "$RUNNER_TEMP/cluster-v16/app/build/outputs/apk/release/app-release.apk" "$OUT/DolphinCluster-v1.6-VEHICLE-RELEASE.apk"
          else
            cp "$RUNNER_TEMP/cluster-v16/app/build/outputs/apk/debug/app-debug.apk" "$OUT/DolphinCluster-v1.6-VEHICLE-DEBUG.apk"
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT"/*.apk > "$OUT/apk-badging.txt"
          grep -Fq "package: name='com.dolphin.clusterprobe.v15'" "$OUT/apk-badging.txt"
          (cd "$OUT" && sha256sum *.apk > SHA256.txt)
      - name: Upload APK for user to install manually
        uses: actions/upload-artifact@v4
        with:
          name: DolphinCluster-V1.6-VEHICLE-APK
          path: ${{ runner.temp }}/cluster-v16-artifact/
          if-no-files-found: error
          retention-days: 14
